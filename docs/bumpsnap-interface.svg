<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">BumpSnap interface preview</title><desc id="desc">Static preview derived from the current 240 by 320 Rabbit r1 interface.</desc><rect width="1200" height="720" fill="#11100e"/><text x="80" y="90" font-family="Arial" font-size="34" font-weight="700" fill="#f7eedf">BumpSnap</text><text x="80" y="126" font-family="monospace" font-size="16" fill="#c4b193">PREGNANCY PHOTO TRACKER FOR RABBIT R1</text><g transform="translate(430 55) scale(1.8)"><rect width="240" height="320" rx="18" fill="#0e0c0a" stroke="#4a3e32" stroke-width="2"/><rect width="240" height="48" rx="18" fill="#201a15"/><text x="12" y="31" font-family="Arial" font-size="23" font-weight="900" fill="#ffe4cc">BumpSnap</text><rect x="170" y="8" width="28" height="28" rx="8" fill="#2b241d" stroke="#6d5c49"/><text x="184" y="27" text-anchor="middle" font-size="14">▣</text><rect x="202" y="8" width="28" height="28" rx="8" fill="#2b241d" stroke="#6d5c49"/><text x="216" y="27" text-anchor="middle" font-size="14">⚙</text><circle cx="120" cy="112" r="52" fill="#15100d" stroke="#ff8d45"/><text x="120" y="116" text-anchor="middle" font-family="Arial" font-size="46" font-weight="900" fill="#ffefe2">28</text><text x="120" y="136" text-anchor="middle" font-family="monospace" font-size="8" fill="#cbb89e">WEEK</text><text x="120" y="184" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#ffe9d0">3rd Trimester</text><text x="120" y="202" text-anchor="middle" font-family="monospace" font-size="9" fill="#ceb899">Due: Oct 2026</text><rect x="18" y="222" width="204" height="42" rx="11" fill="#ff732f"/><text x="120" y="248" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#25150a">Take Photo</text><rect x="18" y="274" width="204" height="34" rx="10" fill="#211a15" stroke="#5c4d3e"/><text x="120" y="296" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#f7eedf">Gallery</text></g><text x="80" y="260" font-family="Arial" font-size="18" font-weight="700" fill="#f7eedf">Hardware-aware interaction</text><text x="80" y="294" font-family="Arial" font-size="15" fill="#c4b193">Scroll events change week and setup values.</text><text x="80" y="322" font-family="Arial" font-size="15" fill="#c4b193">Side-click controls capture and navigation.</text><text x="80" y="350" font-family="Arial" font-size="15" fill="#c4b193">Long-press and double-click shortcuts open the gallery.</text><text x="80" y="430" font-family="Arial" font-size="18" font-weight="700" fill="#f7eedf">Local-first state</text><text x="80" y="464" font-family="Arial" font-size="15" fill="#c4b193">Photos and setup state persist in Rabbit creationStorage</text><text x="80" y="492" font-family="Arial" font-size="15" fill="#c4b193">with localStorage as a browser fallback.</text><text x="80" y="572" font-family="Arial" font-size="18" font-weight="700" fill="#f7eedf">Purpose-built display</text><text x="80" y="606" font-family="Arial" font-size="15" fill="#c4b193">The UI targets a 240 × 320 viewport rather than adapting a</text><text x="80" y="634" font-family="Arial" font-size="15" fill="#c4b193">desktop web layout to the device after the fact.</text></svg>